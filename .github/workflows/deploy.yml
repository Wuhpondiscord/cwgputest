name: Deploy WebGPU Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install 'huggingface_hub>=0.32,<2'
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("HF_TOKEN GitHub secret is missing")
          HfApi(token=token).upload_folder(
              folder_path=".",
              repo_id="wuhp/cwgputest",
              repo_type="space",
              ignore_patterns=[".git/*", ".github/*", "*.pyc", "__pycache__/*"],
              commit_message="Deploy WebGPU research lab from GitHub",
          )
          PY
